name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: cargo test --workspace --locked

      - name: Build app bundle
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/build-app.sh

      - name: Collect and verify release artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="releases/LazeCode-${VERSION}-macos-aarch64.app.tar.gz"
          export VERSION TARBALL
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, sys

          version = os.environ["VERSION"]
          tarball = os.environ["TARBALL"]
          manifest = json.load(open("latest.json", encoding="utf-8"))

          # The tag, the committed artifact and the manifest must agree, and
          # the manifest must verify against the public key pinned in the app.
          assert manifest["version"] == version, manifest["version"]
          digest = hashlib.sha256(open(tarball, "rb").read()).hexdigest()
          assert manifest["sha256"] == digest, "manifest sha256 != artifact"
          assert manifest["url"].endswith("/" + os.path.basename(tarball)), manifest["url"]

          settings = open("crates/lazecode-core/src/settings.rs", encoding="utf-8").read()
          key = re.search(r'update_public_key: "([^"]+)"', settings).group(1)
          fields = ["version", "url", "sha256", "notes", "min_os", "arch", "kind"]
          payload = json.dumps(
              {field: manifest.get(field) or "" for field in fields},
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode()
          open("payload.bin", "wb").write(payload)
          raw = base64.b64decode(key + "=" * (-len(key) % 4))
          open("manifest-public.der", "wb").write(bytes.fromhex("302a300506032b6570032100") + raw)
          open("payload.sig", "wb").write(
              base64.b64decode(manifest["signature"] + "=" * (-len(manifest["signature"]) % 4))
          )
          result = subprocess.run(
              ["openssl", "pkeyutl", "-verify", "-pubin", "-keyform", "DER",
               "-inkey", "manifest-public.der", "-rawin", "-in", "payload.bin",
               "-sigfile", "payload.sig"],
              capture_output=True, text=True,
          )
          if result.returncode != 0:
              sys.exit("manifest signature does not verify:\n" + result.stdout + result.stderr)
          print("updater manifest verified for", version)
          PY

          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            dist/LazeCode.app \
            "release-artifacts/LazeCode-${VERSION}-macos-$(uname -m).app.zip"
          cp "$TARBALL" release-artifacts/
          # Published under a native-specific name: the legacy Tauri updater
          # reads `latest.json` on the release it points at, and that schema
          # must stay untouched for users still on the 0.2.0 app.
          cp latest.json release-artifacts/latest-native.json

      - uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          generate_release_notes: true
