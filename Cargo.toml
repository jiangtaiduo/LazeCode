[workspace]
resolver = "2"
members = [
    "crates/lazecode-core",
    "crates/lazecode-fs",
    "crates/lazecode-text",
    "crates/lazecode-git",
    "crates/lazecode-terminal",
    "crates/lazecode-ui",
    "crates/lazecode-app",
]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT"
authors = ["LazeCode contributors"]
repository = "https://github.com/jiangtaiduo/LazeCode"

[workspace.dependencies]
lazecode-core = { path = "crates/lazecode-core" }
lazecode-fs = { path = "crates/lazecode-fs" }
lazecode-text = { path = "crates/lazecode-text" }
lazecode-git = { path = "crates/lazecode-git" }
lazecode-terminal = { path = "crates/lazecode-terminal" }
lazecode-ui = { path = "crates/lazecode-ui" }

anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
dirs = "6"
crossbeam-channel = "0.5"
parking_lot = "0.12"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links"] }
egui-wgpu = { version = "0.37", features = ["winit"] }
wgpu = "30"
winit = "0.30"
ropey = "1.6"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
similar = "2"
unicode-width = "0.2"
notify = "8"
ignore = "0.4"
regex = "1"
globset = "0.4"
encoding_rs = "0.8"
chardetng = "0.1"
gix = { version = "0.90", default-features = false, features = ["basic", "status", "excludes", "dirwalk", "attributes", "credentials", "merge", "sha1", "worktree-mutation", "blocking-network-client", "blocking-http-transport-reqwest-rust-tls"] }
alacritty_terminal = "0.26"
vte = "0.15"
portable-pty = "0.9"
libc = "0.2"
fontdb = { version = "0.23", features = ["fs", "memmap"] }
memmap2 = "0.9"
ring = "0.17"
tar = "0.4"
imara-diff = { package = "gix-imara-diff", version = "0.3" }
flate2 = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
