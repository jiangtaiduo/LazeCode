name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Verify the signed update manifest
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1].removeprefix("v")
          manifest = json.loads(Path("latest.json").read_text(encoding="utf-8"))
          if manifest.get("version") != version:
              sys.exit(f"latest.json version {manifest.get('version')!r} != tag {version!r}")
          artifact = Path("releases") / manifest["url"].rsplit("/", 1)[-1]
          if not artifact.is_file():
              sys.exit(f"missing update artifact: {artifact}")
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          if digest != manifest.get("sha256"):
              sys.exit(f"latest.json sha256 {manifest.get('sha256')} != artifact {digest}")
          PY

      - name: cargo test
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee /tmp/cargo-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the failing test names through check-run annotations:
            # raw logs need repository admin access, annotations do not.
            grep -E "^(test .* FAILED|thread '.*' panicked|---- .* stdout ----|error: test failed|failures:)" \
              /tmp/cargo-test.log | head -40 | while IFS= read -r line; do
              echo "::error title=Cargo test failure::$line"
            done
            exit "$status"
          fi

      - name: Build app bundle
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/build-app.sh

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - name: Collect and verify release artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="releases/LazeCode-${VERSION}-macos-aarch64.app.tar.gz"
          export VERSION TARBALL
          python3 - <<'PY'
          import hashlib, json, os, sys, tarfile

          version = os.environ["VERSION"]
          tarball = os.environ["TARBALL"]
          manifest = json.load(open("latest.json", encoding="utf-8"))

          # The tag, the committed artifact and the manifest must agree, and
          # the manifest must verify against the public key pinned in the app.
          assert manifest["version"] == version, manifest["version"]
          digest = hashlib.sha256(open(tarball, "rb").read()).hexdigest()
          assert manifest["sha256"] == digest, "manifest sha256 != artifact"
          assert manifest["url"].endswith("/" + os.path.basename(tarball)), manifest["url"]

          # The extractor accepts exactly one `.app` root; macOS tar adds
          # AppleDouble sidecars unless the release script suppresses them.
          with tarfile.open(tarball) as archive:
              names = archive.getnames()
          roots = {name.split("/", 1)[0] for name in names if name.strip()}
          metadata = [
              name
              for name in names
              if any(part.startswith("._") or part == ".DS_Store" for part in name.split("/"))
          ]
          assert roots == {"LazeCode.app"}, f"unexpected archive roots: {sorted(roots)}"
          assert not metadata, f"archive carries AppleDouble metadata: {metadata[:3]}"

          print("manifest version and archive shape verified")
          PY
          # Verify with the app's own ring-based verifier: the runner's
          # default OpenSSL 1.1.1 cannot do Ed25519 through pkeyutl.
          cargo run -q -p lazecode-core --example verify_update_manifest -- latest.json

          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            dist/LazeCode.app \
            "release-artifacts/LazeCode-${VERSION}-macos-$(uname -m).app.zip"
          cp "$TARBALL" release-artifacts/
          cp "dist/LazeCode_${VERSION}_"*.dmg release-artifacts/
          # Published under a native-specific name: the legacy Tauri updater
          # reads `latest.json` on the release it points at, and that schema
          # must stay untouched for users still on the 0.2.0 app.
          cp latest.json release-artifacts/latest-native.json

      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
