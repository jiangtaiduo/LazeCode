name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee /tmp/cargo-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface failure details through check-run annotations: raw logs
            # need repository admin access, annotations are public.
            clean=$(mktemp)
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/cargo-test.log > "$clean"
            # GitHub caps annotations per step; panic context must come first.
            {
              echo "openssl: $(which openssl || true) $(openssl version 2>&1 || true)"
              echo "git: $(git --version 2>&1 || true) HOME=$HOME"
              awk '/panicked at/{count=10} count-->0' "$clean"
              grep -E "^(test .* FAILED|error: test failed)" "$clean"
            } | head -40 | while IFS= read -r line; do
              echo "::error title=Cargo test failure::$line"
            done
            exit "$status"
          fi
      - run: ./scripts/build-app.sh --debug
