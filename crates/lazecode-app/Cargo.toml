[package]
name = "lazecode-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "LazeCode native application shell"

[[bin]]
name = "lazecode"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
bytemuck.workspace = true
pollster.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
winit.workspace = true
lazecode-core.workspace = true
lazecode-fs.workspace = true
lazecode-text.workspace = true
lazecode-git.workspace = true
lazecode-terminal.workspace = true
lazecode-ui.workspace = true
dirs.workspace = true
rfd = "0.16"
png = "0.17"
encoding_rs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSURL"] }
